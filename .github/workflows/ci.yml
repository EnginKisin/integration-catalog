name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: integration_payload_test_20261025
          POSTGRES_USER: catalog_payload_test
          POSTGRES_PASSWORD: payload-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog_payload_test -d integration_payload_test_20261025"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/integration_payload_test_20261025
      SPRING_DATASOURCE_USERNAME: catalog_payload_test
      SPRING_DATASOURCE_PASSWORD: payload-test-only-password
      CATALOG_CREDENTIALS_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CATALOG_ADMIN_USERNAME: payload-test-admin
      CATALOG_ADMIN_PASSWORD: payload-test-admin-password
      SPRING_JPA_SHOW_SQL: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check repository hygiene and documentation links
        run: |
          python3 scripts/check_repository.py
          python3 scripts/generate_error_catalog.py --check
      - name: Run all tests including PostgreSQL roundtrips and package the application
        run: ./mvnw --batch-mode --no-transfer-progress -Dcatalog.payload.postgres-test=true verify
