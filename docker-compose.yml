services:
  postgres:
    image: postgres:16-alpine
    container_name: integration_catalog_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catalog_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-integration_catalog}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-integration_catalog}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-catalog_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "5000"
      SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: "2000"
      SPRING_JPA_SHOW_SQL: "false"
      CATALOG_ADMIN_USERNAME: ${CATALOG_ADMIN_USERNAME:-}
      CATALOG_ADMIN_PASSWORD: ${CATALOG_ADMIN_PASSWORD:-}
      CATALOG_CREDENTIALS_KEY: ${CATALOG_CREDENTIALS_KEY:?Set CATALOG_CREDENTIALS_KEY in .env}
      CATALOG_CREDENTIALS_MIGRATE: ${CATALOG_CREDENTIALS_MIGRATE:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      ACCOUNT_ACTION_URL: ${ACCOUNT_ACTION_URL:-http://localhost:5173/account/action}
      AI_ENABLED:
      AI_PROVIDER:
      AI_BASE_URL:
      AI_MODEL:
      GEMINI_API_KEY:
      AI_REQUEST_TIMEOUT_SECONDS:
      AI_CONTEXT_TOKENS:
      AI_MAX_OUTPUT_TOKENS:
    networks:
      - default
      - ai_internal
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.13}
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: "10m"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai_internal
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-6g}
    cpus: ${OLLAMA_CPUS:-4}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ollama-model-pull:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.13}
    profiles: ["ai-setup"]
    restart: "no"
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MODEL: ${AI_MODEL:-}
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - model_download
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -z "$$OLLAMA_MODEL" ]; then
          echo "Set AI_MODEL in .env before running ollama-model-pull" >&2
          exit 1
        fi
        ollama serve &
        server_pid=$$!
        trap 'kill "$$server_pid" 2>/dev/null || true' EXIT INT TERM
        attempts=0
        until ollama list >/dev/null 2>&1; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 30 ]; then exit 1; fi
          sleep 1
        done
        ollama pull "$$OLLAMA_MODEL"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  postgres_data:
  ollama_data:

networks:
  ai_internal:
    internal: true
  model_download:
