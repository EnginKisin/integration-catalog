services:
  postgres:
    image: postgres:16-alpine
    container_name: integration_catalog_db
    environment:
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog_password
      POSTGRES_DB: integration_catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_user -d integration_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: