spring.application.name=integration-catalog

spring.datasource.url=jdbc:postgresql://localhost:5432/integration_catalog
spring.datasource.username=catalog_user
spring.datasource.password=catalog_password
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

catalog.bootstrap.username=${CATALOG_ADMIN_USERNAME:}
catalog.bootstrap.password=${CATALOG_ADMIN_PASSWORD:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
catalog.credentials.key=${CATALOG_CREDENTIALS_KEY:}
catalog.credentials.migrate=${CATALOG_CREDENTIALS_MIGRATE:false}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false
management.health.mail.enabled=false
catalog.accounts.mail-from=${MAIL_FROM:no-reply@localhost}
catalog.accounts.action-url=${ACCOUNT_ACTION_URL:http://localhost:5173/account/action}

catalog.ai.enabled=${AI_ENABLED:false}
catalog.ai.provider=${AI_PROVIDER:ollama}
catalog.ai.base-url=${AI_BASE_URL:http://ollama:11434}
catalog.ai.model=${AI_MODEL:qwen3.5:4b}
catalog.ai.gemini-api-key=${GEMINI_API_KEY:}
catalog.ai.request-timeout-seconds=${AI_REQUEST_TIMEOUT_SECONDS:300}
catalog.ai.max-fields=100
catalog.ai.max-input-bytes=65536
catalog.ai.context-tokens=${AI_CONTEXT_TOKENS:8192}
catalog.ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:2048}
catalog.ai.max-pending-jobs=10
catalog.ai.job-ttl-hours=24

